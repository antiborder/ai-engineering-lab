[project]
name = "ai-engineering-lab-backend"
version = "0.1.0"
description = "AI Engineering Lab backend (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "google-cloud-firestore>=2.28.1",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "numpy>=2.5.2",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.2",
    "torch>=2.13.0",
    "uvicorn[standard]>=0.52.3",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# B008: FastAPI's `Depends(...)` in argument defaults is the idiomatic
# dependency-injection pattern, not the footgun this rule targets.
ignore = ["B008"]

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.3",
]
